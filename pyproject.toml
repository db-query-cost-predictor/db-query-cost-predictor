[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-cost-predictor"
version = "0.1.0"
description = "Database Query Cost Predictor - poster evidence milestone (pilot audit, PostgreSQL smoke collector, manual rewrite verification, evidence builder)."
readme = "POSTER_RUNBOOK.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2,<3.3",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.25"]
dev = ["pytest>=8.0"]

[project.scripts]
qcp = "query_cost_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (live databases) never run unless explicitly selected.
addopts = "-m \"not integration\""
markers = [
    "integration: requires running PostgreSQL containers; never selected by default",
]
