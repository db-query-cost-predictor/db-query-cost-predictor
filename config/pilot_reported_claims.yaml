# Previously reported pilot values, compared by `pilot-audit` against values it
# recomputes independently from reference_pilot/output/ raw files.
#
# Fields
#   id        stable identifier
#   source    document that reported the value
#   reported  the value as reported (copied from the source; not recomputed)
#   metric    key in the audit's flat `recomputed` dictionary
#   rule      exact | abs | rel | not_comparable | not_recomputable | not_recomputed
#   tolerance for abs/rel rules (reported values are often rounded)
#   note      why the rule was chosen
#
# A MISMATCH is always shown in reports/poster/pilot_claim_check.md and is never
# overwritten. This file contains reported values only — no new results.
