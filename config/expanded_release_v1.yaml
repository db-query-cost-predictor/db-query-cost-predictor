  # ============================================================================ manual reference rewrite pairs (25 groups)
  # Hand-written MANUAL_REFERENCE_REWRITE pairs. Both forms are collected as modeling
  # keys in ONE semantic group. Their equivalence is argued in writing here and is
  # NOT_YET_VERIFIED: verification needs the rewrite harness extended to this spec
  # (planned). Five groups are reserved for the RQ2 holdout: never used for RQ1
  # training, preprocessing, calibration or tuning, and never sampled.
  rewrite:
    snapshots: [tpch_sf0_1, tpch_sf1]
    configurations: [C1_baseline, C2_reduced_work_mem]
    pairs:
      - name: rw01_extract_year
        expected_mechanism: "EXTRACT() on the indexed o_orderdate blocks an index range; the half-open range can use it."
        equivalence_argument: >-
          o_orderdate is DATE NOT NULL. EXTRACT(YEAR FROM d) = Y holds exactly when make_date(Y, 1, 1) <= d <
          make_date(Y + 1, 1, 1). Both forms aggregate the same rows with the same expressions.
        preconditions:
          - {name: o_orderdate_date_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_orderdate' AND data_type = 'date' AND is_nullable = 'NO'"}
        parameter_types: {year: int}
        parameters: {kind: sample, count: 4, seed: 4101, domains: {year: {int_range: [1992, 1998]}}}
        original_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE EXTRACT(YEAR FROM o_orderdate) = {year}
        rewrite_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE o_orderdate >= make_date({year}, 1, 1)
            AND o_orderdate < make_date({year} + 1, 1, 1)
      - name: rw02_date_trunc_month
        expected_mechanism: "date_trunc() on the indexed column blocks an index range; the month range can use it."
        equivalence_argument: >-
          o_orderdate is DATE NOT NULL and the cast to timestamp is midnight of the same day. For the first day m of a
          month, date_trunc('month', d::timestamp) = m::timestamp exactly when m <= d < (m + 1 month)::date.
        preconditions:
          - {name: o_orderdate_date_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_orderdate' AND data_type = 'date' AND is_nullable = 'NO'"}
        parameter_types: {month_start: date}
        parameters: {kind: sample, count: 4, seed: 4102, domains: {month_start: {month_start: ["1992-01", "1998-07"]}}}
        original_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE date_trunc('month', o_orderdate::timestamp) = DATE '{month_start}'::timestamp
        rewrite_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE o_orderdate >= DATE '{month_start}'
            AND o_orderdate < (DATE '{month_start}' + INTERVAL '1 month')::date
      - name: rw03_cast_to_timestamp
        expected_mechanism: "A cast on the indexed column blocks the index; comparing the date itself can use it."
        equivalence_argument: >-
          CAST(d AS timestamp) is midnight of d and DATE literals compare to timestamps as midnight, so the cast is
          order-preserving: d::timestamp >= a and d::timestamp < a + k hold exactly when d >= a and d < a + k.
        preconditions:
          - {name: o_orderdate_date_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_orderdate' AND data_type = 'date' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4103, domains: {start_date: {date_range: ["1992-02-01", "1998-05-01"]}, days: {int_range: [7, 60]}}}
        original_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE CAST(o_orderdate AS timestamp) >= DATE '{start_date}'
            AND CAST(o_orderdate AS timestamp) < DATE '{start_date}' + {days}
        rewrite_sql: |
          SELECT count(*) AS n_orders, sum(o_totalprice) AS total_price
          FROM orders
          WHERE o_orderdate >= DATE '{start_date}'
            AND o_orderdate < DATE '{start_date}' + {days}
      - name: rw04_date_arithmetic
        holdout_reason: "RQ2 holdout: non-sargable arithmetic on an indexed column"
        expected_mechanism: "Arithmetic on the indexed l_shipdate blocks the index; moving it to the constant side can use it."
        equivalence_argument: >-
          Adding an integer k to a DATE is strictly increasing and invertible in the data range, so d + k BETWEEN a AND
          b holds exactly when d BETWEEN a - k AND b - k. l_shipdate is DATE NOT NULL.
        preconditions:
          - {name: l_shipdate_date_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lineitem' AND column_name = 'l_shipdate' AND data_type = 'date' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4104, domains: {start_date: {date_range: ["1992-03-01", "1998-10-01"]}, days: {int_range: [1, 30]}}}
        original_sql: |
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM lineitem
          WHERE l_shipdate + {days} BETWEEN DATE '{start_date}' AND DATE '{start_date}' + 6
        rewrite_sql: |
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM lineitem
          WHERE l_shipdate BETWEEN DATE '{start_date}' - {days} AND DATE '{start_date}' + 6 - {days}
      - name: rw05_cast_to_text_equality
        expected_mechanism: "Casting the indexed o_custkey to text blocks idx_orders_customer; integer equality can use it."
        equivalence_argument: >-
          o_custkey is a NOT NULL integer and the literal is rendered from an integer without sign or leading zeros,
          so the canonical text of o_custkey equals it exactly when o_custkey equals the integer.
        preconditions:
          - {name: o_custkey_integer_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_custkey' AND data_type = 'integer' AND is_nullable = 'NO'"}
        parameter_types: {cust_key: int}
        parameters: {kind: sample, count: 4, seed: 4105, domains: {cust_key: {int_range: [1, 15000]}}}
        original_sql: |
          SELECT count(*) AS n_orders, min(o_orderdate) AS first_order, max(o_orderdate) AS last_order
          FROM orders
          WHERE CAST(o_custkey AS text) = '{cust_key}'
        rewrite_sql: |
          SELECT count(*) AS n_orders, min(o_orderdate) AS first_order, max(o_orderdate) AS last_order
          FROM orders
          WHERE o_custkey = {cust_key}
      - name: rw06_numeric_literal_on_int
        expected_mechanism: "A numeric literal casts the integer l_partkey to numeric, blocking the composite index."
        equivalence_argument: >-
          l_partkey is a NOT NULL integer; integer = numeric compares the integer cast to numeric, and an integer
          equals K.0 exactly when it equals the integer K.
        preconditions:
          - {name: l_partkey_integer_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lineitem' AND column_name = 'l_partkey' AND data_type = 'integer' AND is_nullable = 'NO'"}
        parameter_types: {part_key: int}
        parameters: {kind: sample, count: 4, seed: 4106, domains: {part_key: {int_range: [1, 20000]}}}
        original_sql: |
          SELECT count(*) AS n_lines, avg(l_extendedprice) AS avg_price, max(l_shipdate) AS last_ship
          FROM lineitem
          WHERE l_partkey = {part_key}.0
        rewrite_sql: |
          SELECT count(*) AS n_lines, avg(l_extendedprice) AS avg_price, max(l_shipdate) AS last_ship
          FROM lineitem
          WHERE l_partkey = {part_key}
      - name: rw07_substring_prefix
        expected_mechanism: "substring() prefix test versus LIKE 'word%'; p_name has no index, so a speedup is not expected."
        equivalence_argument: >-
          The word contains only letters (no LIKE wildcards) and p_name is NOT NULL. substring(s FROM 1 FOR
          length(w)) = w holds exactly when w is a prefix of s, which is exactly s LIKE w || '%'.
        preconditions:
          - {name: p_name_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'part' AND column_name = 'p_name' AND is_nullable = 'NO'"}
        parameter_types: {word: word}
        parameters: {kind: sample, count: 4, seed: 4107, domains: {word: {choice: [green, blue, red, ivory, khaki, lemon, navy, olive, peach, plum]}}}
        original_sql: |
          SELECT count(*) AS n_parts, avg(p_retailprice) AS avg_price
          FROM part
          WHERE substring(p_name FROM 1 FOR char_length('{word}')) = '{word}'
        rewrite_sql: |
          SELECT count(*) AS n_parts, avg(p_retailprice) AS avg_price
          FROM part
          WHERE p_name LIKE '{word}%'
      - name: rw08_correlated_sum_indexed
        expected_mechanism: "Correlated SUM per customer probes idx_orders_customer; the rewrite scans orders once with a hash join."
        equivalence_argument: >-
          c_custkey is the primary key of customer, so GROUP BY c.c_custkey yields one row per qualifying customer.
          The LEFT JOIN keeps customers without orders; SUM over their NULL-extended row is NULL, as is the scalar
          subquery. No COALESCE is added.
        preconditions:
          - {name: customer_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.customer'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (c_custkey)'"}
        parameter_types: {nation_key: int}
        parameters: {kind: sample, count: 4, seed: 4108, domains: {nation_key: {int_range: [0, 24]}}}
        original_sql: |
          SELECT c.c_custkey,
                 (SELECT sum(o.o_totalprice) FROM orders o WHERE o.o_custkey = c.c_custkey) AS total_spend
          FROM customer c
          WHERE c.c_nationkey = {nation_key}
        rewrite_sql: |
          SELECT c.c_custkey, sum(o.o_totalprice) AS total_spend
          FROM customer c
          LEFT JOIN orders o ON o.o_custkey = c.c_custkey
          WHERE c.c_nationkey = {nation_key}
          GROUP BY c.c_custkey
      - name: rw09_correlated_count_indexed
        expected_mechanism: "Correlated COUNT per customer (indexed) versus one outer join with grouping."
        equivalence_argument: >-
          c_custkey is the primary key; count(o.o_orderkey) over the LEFT JOIN counts matching orders because
          o_orderkey is NOT NULL, and is 0 for customers without orders, exactly like the scalar count(*).
        preconditions:
          - {name: customer_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.customer'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (c_custkey)'"}
          - {name: o_orderkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_orderkey' AND is_nullable = 'NO'"}
        parameter_types: {nation_key: int}
        parameters: {kind: sample, count: 4, seed: 4109, domains: {nation_key: {int_range: [0, 24]}}}
        original_sql: |
          SELECT c.c_custkey,
                 (SELECT count(*) FROM orders o WHERE o.o_custkey = c.c_custkey) AS n_orders
          FROM customer c
          WHERE c.c_nationkey = {nation_key}
        rewrite_sql: |
          SELECT c.c_custkey, count(o.o_orderkey) AS n_orders
          FROM customer c
          LEFT JOIN orders o ON o.o_custkey = c.c_custkey
          WHERE c.c_nationkey = {nation_key}
          GROUP BY c.c_custkey
      - name: rw10_correlated_sum_unindexed
        holdout_reason: "RQ2 holdout: correlated aggregate on a non-leading index column"
        expected_mechanism: "l_suppkey is only the second column of idx_lineitem_part_supp, so each correlated SUM may scan the whole index; the rewrite aggregates lineitem once."
        equivalence_argument: >-
          s_suppkey is the primary key of supplier and the derived table has one row per l_suppkey, so each supplier
          joins at most one aggregate row. The LEFT JOIN keeps suppliers without lineitems with a NULL sum, matching
          the scalar subquery over no rows.
        preconditions:
          - {name: supplier_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.supplier'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (s_suppkey)'"}
        parameter_types: {nation_key: int}
        parameters: {kind: sample, count: 4, seed: 4110, domains: {nation_key: {int_range: [0, 24]}}}
        original_sql: |
          SELECT s.s_suppkey,
                 (SELECT sum(l.l_quantity) FROM lineitem l WHERE l.l_suppkey = s.s_suppkey) AS supplied_qty
          FROM supplier s
          WHERE s.s_nationkey = {nation_key}
        rewrite_sql: |
          SELECT s.s_suppkey, agg.supplied_qty
          FROM supplier s
          LEFT JOIN (SELECT l.l_suppkey, sum(l.l_quantity) AS supplied_qty FROM lineitem l GROUP BY l.l_suppkey) AS agg
            ON agg.l_suppkey = s.s_suppkey
          WHERE s.s_nationkey = {nation_key}
      - name: rw11_in_to_exists
        expected_mechanism: "IN (subquery) versus a correlated EXISTS; PostgreSQL usually plans both as a semi-join."
        equivalence_argument: >-
          c_custkey and o_custkey are NOT NULL, so c IN (subquery) is true exactly when a qualifying order with
          o_custkey = c_custkey exists, which is the EXISTS condition. Both count qualifying customers once.
        preconditions:
          - {name: o_custkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_custkey' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4111, domains: {start_date: {date_range: ["1992-02-01", "1997-06-01"]}, days: {int_range: [30, 400]}}}
        original_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE c.c_custkey IN (SELECT o.o_custkey FROM orders o
                                WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days})
        rewrite_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE EXISTS (SELECT 1 FROM orders o
                        WHERE o.o_custkey = c.c_custkey
                          AND o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days})
      - name: rw12_not_in_to_not_exists
        holdout_reason: "RQ2 holdout: NOT IN versus anti-join (hashed versus plain subplan depends on work_mem)"
        expected_mechanism: "NOT IN with a subquery uses a hashed SubPlan only if it fits in memory; otherwise it rescans per row. NOT EXISTS plans as an anti-join."
        equivalence_argument: >-
          NOT IN differs from NOT EXISTS only when the subquery yields NULL. o_custkey and c_custkey are NOT NULL,
          so c NOT IN (subquery) is true exactly when no qualifying order references c, which is NOT EXISTS.
        preconditions:
          - {name: o_custkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_custkey' AND is_nullable = 'NO'"}
          - {name: c_custkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'customer' AND column_name = 'c_custkey' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4112, domains: {start_date: {date_range: ["1992-02-01", "1997-06-01"]}, days: {int_range: [30, 400]}}}
        original_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE c.c_custkey NOT IN (SELECT o.o_custkey FROM orders o
                                    WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days})
        rewrite_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE NOT EXISTS (SELECT 1 FROM orders o
                            WHERE o.o_custkey = c.c_custkey
                              AND o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days})
      - name: rw13_distinct_join_to_exists
        expected_mechanism: "DISTINCT over a join that multiplies rows versus a semi-join that never does."
        equivalence_argument: >-
          c_custkey is the primary key, so (c_custkey, c_name) identifies a customer. DISTINCT over the join returns each
          customer with at least one qualifying order exactly once; EXISTS returns the same customers exactly once.
        preconditions:
          - {name: customer_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.customer'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (c_custkey)'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4113, domains: {start_date: {date_range: ["1992-02-01", "1997-06-01"]}, days: {int_range: [30, 400]}}}
        original_sql: |
          SELECT DISTINCT c.c_custkey, c.c_name
          FROM customer c
          JOIN orders o ON o.o_custkey = c.c_custkey
          WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days}
        rewrite_sql: |
          SELECT c.c_custkey, c.c_name
          FROM customer c
          WHERE EXISTS (SELECT 1 FROM orders o
                        WHERE o.o_custkey = c.c_custkey
                          AND o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days})
      - name: rw14_count_distinct_to_group
        expected_mechanism: "count(DISTINCT) sorts inside the aggregate; grouping first can use hash aggregation."
        equivalence_argument: >-
          l_suppkey is NOT NULL, so count(DISTINCT l_suppkey) equals the number of groups of GROUP BY l_suppkey over
          the same rows; both are 0 when no row qualifies.
        preconditions:
          - {name: l_suppkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lineitem' AND column_name = 'l_suppkey' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4114, domains: {start_date: {date_range: ["1992-02-01", "1998-06-01"]}, days: {int_range: [7, 180]}}}
        original_sql: |
          SELECT count(DISTINCT l.l_suppkey) AS n_suppliers
          FROM lineitem l
          WHERE l.l_shipdate >= DATE '{start_date}' AND l.l_shipdate < DATE '{start_date}' + {days}
        rewrite_sql: |
          SELECT count(*) AS n_suppliers
          FROM (SELECT l.l_suppkey
                FROM lineitem l
                WHERE l.l_shipdate >= DATE '{start_date}' AND l.l_shipdate < DATE '{start_date}' + {days}
                GROUP BY l.l_suppkey) AS s
      - name: rw15_union_to_union_all
        expected_mechanism: "UNION deduplicates (sort or hash); UNION ALL does not need to when branches are disjoint."
        equivalence_argument: >-
          Each branch returns distinct rows because o_orderkey is the primary key, and the two key ranges
          [k, k + w] and [k + w + 1, k + 2w] are disjoint, so the combined rows contain no duplicate for UNION to remove.
        preconditions:
          - {name: orders_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.orders'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (o_orderkey)'"}
        parameter_types: {start_key: int, width: int}
        parameters: {kind: sample, count: 4, seed: 4115, domains: {start_key: {int_range: [1, 400000]}, width: {int_range: [1000, 50000]}}}
        original_sql: |
          SELECT o.o_orderkey, o.o_custkey, o.o_totalprice FROM orders o
          WHERE o.o_orderkey BETWEEN {start_key} AND {start_key} + {width}
          UNION
          SELECT o.o_orderkey, o.o_custkey, o.o_totalprice FROM orders o
          WHERE o.o_orderkey BETWEEN {start_key} + {width} + 1 AND {start_key} + 2 * {width}
        rewrite_sql: |
          SELECT o.o_orderkey, o.o_custkey, o.o_totalprice FROM orders o
          WHERE o.o_orderkey BETWEEN {start_key} AND {start_key} + {width}
          UNION ALL
          SELECT o.o_orderkey, o.o_custkey, o.o_totalprice FROM orders o
          WHERE o.o_orderkey BETWEEN {start_key} + {width} + 1 AND {start_key} + 2 * {width}
      - name: rw16_having_to_where
        expected_mechanism: "A HAVING filter on a grouping column; PostgreSQL may already push it into WHERE (no change expected)."
        equivalence_argument: >-
          The HAVING predicate references only the grouping column, so it removes whole groups; filtering the same
          predicate before grouping removes exactly the rows of those groups.
        preconditions: []
        parameter_types: {flag: token, delta_days: int}
        parameters: {kind: sample, count: 4, seed: 4116, domains: {flag: {choice: [A, N, R]}, delta_days: {int_range: [60, 120]}}}
        original_sql: |
          SELECT l_returnflag, count(*) AS n_lines, sum(l_quantity) AS total_qty
          FROM lineitem
          WHERE l_shipdate <= DATE '1998-12-01' - {delta_days}
          GROUP BY l_returnflag
          HAVING l_returnflag = '{flag}'
        rewrite_sql: |
          SELECT l_returnflag, count(*) AS n_lines, sum(l_quantity) AS total_qty
          FROM lineitem
          WHERE l_shipdate <= DATE '1998-12-01' - {delta_days}
            AND l_returnflag = '{flag}'
          GROUP BY l_returnflag
      - name: rw17_correlated_max_indexed
        expected_mechanism: "Correlated MAX per part uses the l_partkey index; the 'decorrelated' rewrite aggregates all of lineitem (likely slower)."
        equivalence_argument: >-
          p_partkey is the primary key and the derived table has one row per l_partkey, so each part joins at most one
          aggregate row; parts without lineitems keep a NULL maximum, as the scalar subquery over no rows.
        preconditions:
          - {name: part_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.part'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (p_partkey)'"}
        parameter_types: {size: int}
        parameters: {kind: sample, count: 4, seed: 4117, domains: {size: {int_range: [1, 50]}}}
        original_sql: |
          SELECT p.p_partkey,
                 (SELECT max(l.l_extendedprice) FROM lineitem l WHERE l.l_partkey = p.p_partkey) AS max_price
          FROM part p
          WHERE p.p_size = {size}
        rewrite_sql: |
          SELECT p.p_partkey, agg.max_price
          FROM part p
          LEFT JOIN (SELECT l.l_partkey, max(l.l_extendedprice) AS max_price FROM lineitem l GROUP BY l.l_partkey) AS agg
            ON agg.l_partkey = p.p_partkey
          WHERE p.p_size = {size}
      - name: rw18_or_to_in
        expected_mechanism: "OR of equalities versus an IN-list on an unindexed column (little change expected)."
        equivalence_argument: >-
          x = a OR x = b holds exactly when x IN (a, b) for a NOT NULL column; l_shipmode is NOT NULL.
        preconditions:
          - {name: l_shipmode_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lineitem' AND column_name = 'l_shipmode' AND is_nullable = 'NO'"}
        parameter_types: {shipmode1: token, shipmode2: token}
        parameters:
          kind: sample
          count: 4
          seed: 4118
          distinct: [[shipmode1, shipmode2]]
          domains:
            shipmode1: {choice: [REG AIR, AIR, RAIL, SHIP, TRUCK, MAIL, FOB]}
            shipmode2: {choice: [REG AIR, AIR, RAIL, SHIP, TRUCK, MAIL, FOB]}
        original_sql: |
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM lineitem
          WHERE l_shipmode = '{shipmode1}' OR l_shipmode = '{shipmode2}'
        rewrite_sql: |
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM lineitem
          WHERE l_shipmode IN ('{shipmode1}', '{shipmode2}')
      - name: rw19_count_positive_to_exists
        expected_mechanism: "Counting every matching order versus stopping at the first (EXISTS)."
        equivalence_argument: >-
          (SELECT count(*) ...) > 0 is true exactly when at least one matching row exists, which is EXISTS (...).
        preconditions: []
        parameter_types: {nation_key: int}
        parameters: {kind: sample, count: 4, seed: 4119, domains: {nation_key: {int_range: [0, 24]}}}
        original_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE c.c_nationkey = {nation_key}
            AND (SELECT count(*) FROM orders o WHERE o.o_custkey = c.c_custkey) > 0
        rewrite_sql: |
          SELECT count(*) AS n_customers
          FROM customer c
          WHERE c.c_nationkey = {nation_key}
            AND EXISTS (SELECT 1 FROM orders o WHERE o.o_custkey = c.c_custkey)
      - name: rw20_redundant_subquery_order
        expected_mechanism: "An ORDER BY inside an aggregated subquery is unnecessary work."
        equivalence_argument: >-
          count and the exact numeric sum over a set of rows do not depend on row order, so removing the subquery's
          ORDER BY leaves the result unchanged.
        preconditions: []
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4120, domains: {start_date: {date_range: ["1992-02-01", "1998-01-01"]}, days: {int_range: [7, 365]}}}
        original_sql: |
          SELECT count(*) AS n_orders, sum(sub.o_totalprice) AS total_price
          FROM (
              SELECT o.o_orderkey, o.o_totalprice
              FROM orders o
              WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days}
              ORDER BY o.o_totalprice DESC
          ) AS sub
        rewrite_sql: |
          SELECT count(*) AS n_orders, sum(sub.o_totalprice) AS total_price
          FROM (
              SELECT o.o_orderkey, o.o_totalprice
              FROM orders o
              WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days}
          ) AS sub
      - name: rw21_inner_join_elimination
        holdout_reason: "RQ2 holdout: redundant inner join over a validated foreign key"
        expected_mechanism: "PostgreSQL 16 does not remove an inner join that only checks a foreign key; the rewrite drops it."
        equivalence_argument: >-
          orders.o_custkey is NOT NULL and references customer(c_custkey), which is unique, so every order joins
          exactly one customer and the join neither removes nor duplicates orders; no customer column is used.
        preconditions:
          - {name: orders_customer_foreign_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.orders'::regclass AND contype = 'f' AND confrelid = 'public.customer'::regclass"}
          - {name: o_custkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_custkey' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4121, domains: {start_date: {date_range: ["1992-02-01", "1998-01-01"]}, days: {int_range: [7, 365]}}}
        original_sql: |
          SELECT count(*) AS n_orders, avg(o.o_totalprice) AS avg_price, max(o.o_shippriority) AS max_priority
          FROM orders o
          JOIN customer c ON c.c_custkey = o.o_custkey
          WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days}
        rewrite_sql: |
          SELECT count(*) AS n_orders, avg(o.o_totalprice) AS avg_price, max(o.o_shippriority) AS max_priority
          FROM orders o
          WHERE o.o_orderdate >= DATE '{start_date}' AND o.o_orderdate < DATE '{start_date}' + {days}
      - name: rw22_left_join_elimination
        expected_mechanism: "An unused LEFT JOIN to a unique key; PostgreSQL already removes it (no change expected)."
        equivalence_argument: >-
          c_custkey is unique, so the LEFT JOIN keeps every order exactly once, and no customer column is referenced.
        preconditions:
          - {name: customer_primary_key, sql: "SELECT count(*) = 1 FROM pg_constraint WHERE conrelid = 'public.customer'::regclass AND contype = 'p' AND pg_get_constraintdef(oid) = 'PRIMARY KEY (c_custkey)'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4122, domains: {start_date: {date_range: ["1992-02-01", "1998-01-01"]}, days: {int_range: [7, 365]}}}
        original_sql: |
