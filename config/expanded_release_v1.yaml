      - name: rw23_cte_materialized
        holdout_reason: "RQ2 holdout: materialized CTE blocks predicate pushdown"
        expected_mechanism: "MATERIALIZED stores every CTE row before the outer filter; NOT MATERIALIZED lets the planner push the filter down."
        equivalence_argument: >-
          The CTE is a side-effect-free SELECT; materializing or inlining it yields the same rows, and the outer query
          applies the same filter and aggregates to them.
        preconditions: []
        parameter_types: {start_date: date, days: int, quantity: int}
        parameters: {kind: sample, count: 4, seed: 4123, domains: {start_date: {date_range: ["1992-02-01", "1998-06-01"]}, days: {int_range: [7, 180]}, quantity: {int_range: [1, 50]}}}
        original_sql: |
          WITH recent AS MATERIALIZED (
              SELECT l_orderkey, l_quantity, l_extendedprice
              FROM lineitem
              WHERE l_shipdate >= DATE '{start_date}' AND l_shipdate < DATE '{start_date}' + {days}
          )
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM recent
          WHERE l_quantity >= {quantity}
        rewrite_sql: |
          WITH recent AS NOT MATERIALIZED (
              SELECT l_orderkey, l_quantity, l_extendedprice
              FROM lineitem
              WHERE l_shipdate >= DATE '{start_date}' AND l_shipdate < DATE '{start_date}' + {days}
          )
          SELECT count(*) AS n_lines, sum(l_extendedprice) AS revenue
          FROM recent
          WHERE l_quantity >= {quantity}
      - name: rw24_coalesce_not_null
        expected_mechanism: "coalesce() on the NOT NULL indexed l_shipdate blocks the index range."
        equivalence_argument: >-
          l_shipdate is NOT NULL, so coalesce(l_shipdate, x) = l_shipdate for every row and both predicates select
          the same rows.
        preconditions:
          - {name: l_shipdate_date_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'lineitem' AND column_name = 'l_shipdate' AND data_type = 'date' AND is_nullable = 'NO'"}
        parameter_types: {start_date: date, days: int}
        parameters: {kind: sample, count: 4, seed: 4124, domains: {start_date: {date_range: ["1992-02-01", "1998-06-01"]}, days: {int_range: [7, 180]}}}
        original_sql: |
          SELECT count(*) AS n_lines, avg(l_discount) AS avg_discount
          FROM lineitem
