      - name: rw25_or_to_union_all
        expected_mechanism: "OR across two indexed columns (often a BitmapOr) versus two disjoint index scans."
        equivalence_argument: >-
          Rows matching A (o_custkey = c) or B (o_orderdate = d) split into A and (B and not A). o_custkey is NOT NULL,
          so "not A" is o_custkey <> c, and UNION ALL of the two disjoint parts returns each matching row exactly once.
        preconditions:
          - {name: o_custkey_not_null, sql: "SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'orders' AND column_name = 'o_custkey' AND is_nullable = 'NO'"}
        parameter_types: {cust_key: int, day: date}
        parameters: {kind: sample, count: 4, seed: 4125, domains: {cust_key: {int_range: [1, 15000]}, day: {date_range: ["1992-01-01", "1998-08-01"]}}}
        original_sql: |
          SELECT o.o_orderkey, o.o_totalprice
          FROM orders o
          WHERE o.o_custkey = {cust_key} OR o.o_orderdate = DATE '{day}'
        rewrite_sql: |
          SELECT o.o_orderkey, o.o_totalprice
          FROM orders o
          WHERE o.o_custkey = {cust_key}
          UNION ALL
          SELECT o.o_orderkey, o.o_totalprice
          FROM orders o
          WHERE o.o_orderdate = DATE '{day}' AND o.o_custkey <> {cust_key}
